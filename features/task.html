<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exercice Alpine.js</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <h1>Watch exercice</h1>

    <div
      x-data="todoList"
      x-init="
         console.log('TodoList ready');
         $watch('tasks.length', (value) => console.log(`Tasks number: ${value}`))
       "
      x-effect="
         message = tasks.length === 0 ? 'No tasks' : `You have ${tasks.length} tasks`;
       "
    >
      <input type="text" x-model="newTask" placeholder="New task" />
      <button @click="addTask()">Add task</button>

      <p x-text="message"></p>

      <ul>
        <template x-for="(task, index) in tasks" :key="index">
          <li>
            <span x-text="task"></span>
            <button @click="removeTask(index)">Remove</button>
          </li>
        </template>
      </ul>
    </div>

    <!-- Alpine script -->
    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("todoList", () => ({
          newTask: "",
          tasks: [],
          message: "No task",

          init() {
            this.tasks.push("Dump task");
          },

          addTask() {
            if (this.newTask.trim() !== "") {
              this.tasks.push(this.newTask.trim());
              this.newTask = "";
            }
          },

          removeTask(index) {
            this.tasks.splice(index, 1);
          },
        }));
      });
    </script>
  </body>
</html>
