<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exercice Alpine.js</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>
    <div x-data="{username: $persist('')}">

      <h1>Trello de <span x-text="username"></span></h1>
      <input type="text" x-model="newTaskTitle" placeholder="Task Title" />
      <input
        type="text"
        x-model="newTaskDescription"
        placeholder="Task Description"
      />
      <select x-model="newTaskStatus">
        <option value="toDo">À faire</option>
        <option value="inProgress">En cours</option>
        <option value="done">Fait</option>
      </select>
      <button @click="addTask()">Ajouter la tâche</button>

      <h2>À faire</h2>
      <ul>
        <template x-for="(task, index) in tasks.toDo" :key="index">
          <li>
            <input type="checkbox" @change="moveTask(task, 'inProgress')" />
            <strong x-text="task.title"></strong>:
            <span x-text="task.description"></span>
          </li>
        </template>
      </ul>

      <h2>En cours</h2>
      <ul>
        <template x-for="(task, index) in tasks.inProgress" :key="index">
          <li>
            <input type="checkbox" @change="moveTask(task, 'done')" />
            <strong x-text="task.title"></strong>:
            <span x-text="task.description"></span>
          </li>
        </template>
      </ul>

      <h2>Fait</h2>
      <ul>
        <template x-for="(task, index) in tasks.done" :key="index">
          <li>
            <input type="checkbox" disabled />
            <strong x-text="task.title"></strong>:
            <span x-text="task.description"></span>
          </li>
        </template>
      </ul>
    </div>
  </body>
</html>
