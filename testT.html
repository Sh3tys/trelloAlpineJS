<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rank Ice Cream Flavors</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .list-group-item {
      cursor: grab;
      user-select: none;
    }
    .list-group-item:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <main class="container mt-5">
    <h1 class="mb-4">Rank Ice Cream Flavors 🍦</h1>
    <div 
      x-data="{ 
        items: ['Chocolate', 'Vanilla', 'Strawberry', 'Cookies and Creme'], 
        newItem:'', 
        dragging: null, 
        dropping: null 
      }"
      @drop.prevent="items = dragDropList(items, dragging, dropping)"
      @dragover.prevent="$event.dataTransfer.dropEffect = 'move'"
    >
      <div class="list-group mb-3">
        <template x-for="(item, index) in items" :key="index">
          <div 
            class="position-relative list-group-item" 
            draggable="true" 
            :class="{'border border-primary': dragging === index}"
            @dragstart="dragging = index" 
            @dragend="dragging = null"
          >
            <div>
              <i class="bi bi-grip-vertical me-2"></i>
              <span x-text="item"></span>
              <button type="button" class="btn btn-outline-danger btn-sm float-end" @click="items.splice(index, 1)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
            <div 
              class="position-absolute" 
              style="top: 0; bottom: 0; right: 0; left: 0;" 
              x-show.transition="dragging !== null" 
              :class="{'bg-secondary bg-opacity-25': dropping === index}"
              @dragenter.prevent="if(index !== dragging) {dropping = index}" 
              @dragleave="if(dropping === index) dropping = null"
            ></div>
          </div>
        </template>

        <div class="input-group mt-3">
          <input type="text" class="form-control" placeholder="Add new flavor" x-model="newItem">
          <button class="btn btn-primary" :disabled="newItem == ''" @click="items.push(newItem); newItem=''">Add Flavor</button>
        </div>
      </div>
    </div>

    <hr>
    <p class="text-muted small">
      Drag & Drop logic by <a href="https://codepen.io/ranjan-purbey/pen/xoEMOM" target="_blank">Ranjan Purbey</a>.
    </p>
  </main>

  <script>
    function dragDropList(items, dragging, dropping) {
      if (dragging !== null && dropping !== null) {
        if (dragging < dropping) {
          items = [
            ...items.slice(0, dragging),
            ...items.slice(dragging + 1, dropping + 1),
            items[dragging],
            ...items.slice(dropping + 1)
          ];
        } else {
          items = [
            ...items.slice(0, dropping),
            items[dragging],
            ...items.slice(dropping, dragging),
            ...items.slice(dragging + 1)
          ];
        }
      }
      return items;
    }
  </script>
</body>
</html>
