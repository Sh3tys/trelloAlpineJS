<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Modal dynamique - Alpine.js</title>
    <script defer src="./tt.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
    ></script>

    <style>
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: white;
        padding: 1.5rem 2rem;
        border-radius: 0.5rem;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .modal-buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1rem;
      }
      .modal-buttons button {
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        border: none;
        cursor: pointer;
      }
      .modal-buttons .confirm {
        background: #48bb78;
        color: white;
      }
      .modal-buttons .cancel {
        background: #f56565;
        color: white;
      }
      .modal-buttons .submit {
        background: #4299e1;
        color: white;
      }
      [x-cloak] {
        display: none !important;
      }
      .input-field {
        width: 100%;
        padding: 0.5rem;
        margin: 0.5rem 0;
        border: 1px solid #e2e8f0;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body x-data>
    <h1>Exemple de plusieurs modaux dynamiques</h1>
    <div style="display: flex; gap: 1rem; margin-bottom: 2rem">
      <button
        @click="$store.modal.open('info', 'Message info 📢', 'Informations importantes')"
      >
        Ouvrir modal info
      </button>
      <button
        @click="$store.modal.open('confirm', 'Voulez-vous vraiment supprimer cet élément ?', 'Confirmation')"
      >
        Ouvrir modal confirmation
      </button>
      <button
        @click="$store.modal.open('form', 'Entrez un nom de liste :', 'Nouvelle Liste', 'Nom de la liste')"
      >
        Ouvrir modal formulaire
      </button>
    </div>

    <!-- Modal -->
    <div
      class="modal-backdrop"
      x-show="$store.modal.show"
      x-transition.opacity
      x-cloak
      @click.self="$store.modal.close()"
    >
      <div class="modal-content">
        <h2 x-text="$store.modal.title"></h2>
        <template x-if="$store.modal.type === 'info'">
          <div>
            <p x-text="$store.modal.content"></p>
            <div class="modal-buttons">
              <button @click="$store.modal.close()" class="confirm">OK</button>
            </div>
          </div>
        </template>
        <template x-if="$store.modal.type === 'confirm'">
          <div>
            <p x-text="$store.modal.content"></p>
            <div class="modal-buttons">
              <button @click="$store.modal.confirm()" class="confirm">
                Oui
              </button>
              <button @click="$store.modal.close()" class="cancel">Non</button>
            </div>
          </div>
        </template>
        <template x-if="$store.modal.type === 'form'">
          <div>
            <p x-text="$store.modal.content"></p>
            <input
              type="text"
              x-model="$store.modal.input"
              :placeholder="$store.modal.placeholder"
              class="input-field"
            />
            <div class="modal-buttons">
              <button @click="$store.modal.submitForm()" class="submit">
                Valider
              </button>
              <button @click="$store.modal.close()" class="cancel">
                Annuler
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </body>
</html>
